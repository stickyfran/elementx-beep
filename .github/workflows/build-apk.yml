name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permite ejecución manual desde la UI de GitHub

concurrency:
  group: beep-debug-${{ github.ref }}
  cancel-in-progress: true

# Enrich gradle.properties for CI/CD to prevent OOM / slow builds
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError" -Dkotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Free disk space ───────────────────────────────────────
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # ── 2. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history para versionado

      # ── 3. Cache de Gradle ───────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Setup JDK 21 ─────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 5. Setup Android SDK ─────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Hacer Gradle ejecutable ───────────────────────────────
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ── 7. Build Debug APK ──────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES

      # ── 8. Upload APK como artifact ─────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elementx-beep-debug-${{ github.sha }}
          path: app/build/outputs/apk/gplay/debug/*.apk
          retention-days: 14

      # ── 9. Comentar en PR con link de descarga ─────────────────
      - name: Comment PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const body = `## 📱 APK de prueba disponible\n\n` +
              `El build se completó exitosamente.\n\n` +
              `**Descargá el APK desde:** [Artifacts de este workflow run](https://github.com/${owner}/${repo}/actions/runs/${run_id})\n\n` +
              `> Buscá el artifact \`elementx-beep-debug-${context.sha.substring(0, 7)}\`\n\n` +
              `Commit: \`${context.sha.substring(0, 7)}\``;
            github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body
            });

