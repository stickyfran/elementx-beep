name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  build:
    name: Build arm64 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Free disk space ───────────────────────────────────────
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # ── 2. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 3. Setup JDK 21 ─────────────────────────────────────────
      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Configure Gradle ─────────────────────────────────────
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 5. Make Gradle executable ────────────────────────────────
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ── 6. Build Debug APK (arm64 only via splits in build.gradle.kts)
      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: ./gradlew :app:assembleGplayDebug --no-configuration-cache --stacktrace

      # ── 7. Upload APK artifact ───────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elementx-beep-debug-${{ github.sha }}
          path: app/build/outputs/apk/gplay/debug/*.apk
          retention-days: 14

      # ── 8. Comment on PR with download link ─────────────────────
      - name: Comment PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const body = `## 📱 APK de prueba disponible\n\n` +
              `El build se completó exitosamente.\n\n` +
              `**Descargá el APK desde:** [Artifacts de este workflow run](https://github.com/${owner}/${repo}/actions/runs/${run_id})\n\n` +
              `> Buscá el artifact \`elementx-beep-debug-${context.sha.substring(0, 7)}\`\n\n` +
              `Commit: \`${context.sha.substring(0, 7)}\``;
            github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body
            });
